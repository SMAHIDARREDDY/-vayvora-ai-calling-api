spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://postgres:5432/vayvora_db
    username: vayvora
    password: vayvora_secure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8003

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
