spring:
  application:
    name: auth-service

  # SAMPLE connection details. Replace DATABASE_URL / DB_USERNAME / DB_PASSWORD
  # with the real values via environment variables; nothing here is a live
  # credential.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vayvora_db}
    username: ${DB_USERNAME:vayvora}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: auth-pool

  jpa:
    hibernate:
      # Schema is owned by the SQL migrations in db/migration; Hibernate only
      # validates that the tables it expects are present.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8001}
  servlet:
    context-path: /api/v1

jwt:
  # Development default. Set JWT_SECRET in every deployed environment; it must
  # be at least 32 bytes and identical across services that verify tokens.
  secret: ${JWT_SECRET:vayvora_local_development_secret_key_change_me}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.vayvora: ${LOG_LEVEL:DEBUG}
