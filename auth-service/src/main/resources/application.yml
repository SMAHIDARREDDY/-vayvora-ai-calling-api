spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres:5432/vayvora_db
    username: vayvora
    password: vayvora_secure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: redis
    port: 6379
    timeout: 60000
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8001
  servlet:
    context-path: /api/v1

jwt:
  secret: your_super_secret_jwt_key_change_in_production
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
